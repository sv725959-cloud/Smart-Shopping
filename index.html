<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Shopping</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🛒 Smart Shopping</h1>
<p>Best Deals & Offers</p>
</header>

<div class="banner">
<h2>🔥 आज के सुपर ऑफर 🔥</h2>
<p>Amazon | Flipkart | Meesho | Myntra</p>
</div>

<div class="card">
<h3>Amazon Deals</h3>
<p>सभी Amazon ऑफर देखें</p>
<a href="#" class="btn">Shop Now</a>
</div>

<div class="card">
<h3>Flipkart Deals</h3>
<p>सभी Flipkart ऑफर देखें</p>
<a href="#" class="btn">Shop Now</a>
</div>

<div class="card">
<h3>Meesho Deals</h3>
<p>सभी Meesho ऑफर देखें</p>
<a href="#" class="btn">Shop Now</a>
</div>

<div class="card">
<h3>रजिस्ट्रेशन (वैकल्पिक)</h3>

<input type="text" placeholder="नाम"><br><br>

<input type="text" placeholder="मोबाइल नंबर"><br><br>

<input type="email" placeholder="ईमेल"><br><br>

<button class="btn">रजिस्टर करें</button>

</div>

</body>
</html>
