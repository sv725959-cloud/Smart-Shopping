<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔴 STEP 1: MAIN ENTRY -->
<div id="entryScreen" class="center">

  <h2>🛒 Smart Shopping</h2>

  <button id="openSignup">Sign Up</button>
  <button id="skipBtn">Skip</button>

</div>

<!-- 🔵 STEP 2: SIGNUP FORM -->
<div id="signupScreen" class="hidden center">

  <h3>Register Details</h3>

  <input id="name" placeholder="Name">
  <input id="mobile" placeholder="Mobile">
  <input id="email" placeholder="Email">

  <button id="submitBtn">Submit</button>

</div>

<!-- 🟢 STEP 3: HOME PAGE -->
<div id="homePage" class="hidden">

<header>
  <h1>🛒 Smart Shopping</h1>
</header>

<div class="banner">
  <h2>🔥 Mega Deals</h2>
</div>

<div class="card">
  <p>Amazon</p>
  <a href="https://amazon.in" target="_blank">Buy</a>
</div>

<div class="card">
  <p>Flipkart</p>
  <a href="https://flipkart.com" target="_blank">Buy</a>
</div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
